
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#87ceeb">
    <title>Minecraft Web</title>
    <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
    <main id="game">
        <div id="player"></div>

        <div id="ground">
            <div class="grass"></div>
            <div class="dirt"></div>
        </div>

        <div id="touch-controls">
            <button id="jump-button" type="button" aria-label="Jump">↑</button>
            <button id="left-button" type="button" aria-label="Move left">←</button>
            <button id="right-button" type="button" aria-label="Move right">→</button>
        </div>

        <div id="help">A / D: حرکت | Space / ↑: پرش</div>
        <div id="debug-status">در حال آماده‌سازی بازی...</div>
    </main>

    <script src="./script.js?v=4"></script>
</body>
</html>
