<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=16">
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=16">
  <meta name="description" content="Minecraft Web — a small block-based browser game">
  <title>Minecraft Web</title>
  <link rel="manifest" href="./manifest.json?v=16">
  <link rel="stylesheet" href="./style.css?v=16">
</head>
<body>
  <section id="rotate-screen" aria-live="polite">
    <div class="rotate-content">
      <div class="phone-animation" aria-hidden="true">
        <div class="phone-frame"><div class="phone-screen"><div class="phone-sky"></div><div class="phone-grass"></div></div></div>
        <span class="rotate-arrow">↻</span>
      </div>
      <h1>گوشی را افقی کن!</h1>
      <p>برای شروع بازی، گوشی را بچرخان و در حالت افقی نگه دار.</p>
      <div class="rotate-hint">↔ حالت افقی</div>
      <button id="try-landscape" type="button">تلاش برای حالت افقی</button>
    </div>
  </section>

  <main id="game-shell">
    <canvas id="game-canvas" aria-label="محیط بازی"></canvas>
    <header id="top-hud">
      <div id="help">لپ‌تاپ: A/D حرکت، Space پرش، کلیک چپ و نگه‌داشتن: شکستن، کلیک راست: قراردادن؛ E: Inventory؛ 1 تا 9: انتخاب Hotbar</div>
      <div id="debug-status" role="status">در حال آماده‌سازی...</div>
    </header>

    <section id="block-panel" aria-label="ابزار بلاک‌ها">
      <label for="block-type">بلاک برای قراردادن</label>
      <select id="block-type" aria-label="بلاک آزمایشی">
        <option value="grass">چمن</option>
        <option value="dirt">خاک</option>
        <option value="stone">سنگ</option>
        <option value="wood">چوب</option>
        <option value="leaves">برگ</option>
      </select>
      <button id="break-button" type="button">شکستن (۱٫۵ ثانیه)</button>
      <button id="place-button" type="button">قراردادن بلاک</button>
    </section>

    <button id="inventory-toggle" type="button">Inventory</button>
    <div id="inventory-panel" hidden></div>
    <nav id="hotbar" aria-label="نوار ابزار"></nav>
    <nav id="touch-controls" aria-label="کنترل لمسی">
      <div class="move-controls">
        <button id="left-button" type="button" aria-label="حرکت به چپ">←</button>
        <button id="right-button" type="button" aria-label="حرکت به راست">→</button>
      </div>
      <div class="action-controls">
        <button id="jump-button" type="button" aria-label="پرش" title="پرش">↑</button>
        <button id="touch-break-button" type="button" aria-label="شکستن بلاک" title="شکستن بلاک">⛏</button>
        <button id="touch-place-button" type="button" aria-label="قراردادن بلاک" title="قراردادن بلاک">▣</button>
      </div>
    </nav>
  </main>
  <script src="./world.js?v=16"></script>
  <script src="./script.js?v=16"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed:', err)));
    }
  </script>
</body>
</html>
